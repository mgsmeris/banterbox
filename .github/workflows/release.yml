name: Release

# Bump "version" in extension/manifest.json and push to main: this builds the
# Chrome .zip and Firefox .xpi and publishes them as GitHub Release v<version>.
# Pushes that don't change the version do nothing here (CI still builds them as
# a run artifact). Pushing a tag like v1.3.1 by hand works too.
#
# Optional: add repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET (an API key
# from addons.mozilla.org → Developer Hub → Manage API Keys) and the release also
# gets a Mozilla-signed .xpi that installs permanently in normal Firefox.
on:
  push:
    branches: [main]
    paths: ['extension/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Work out the version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version $v" >&2
            exit 1
          fi
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v already exists; bump the version in manifest.json for a new one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.v.outputs.skip != 'true'
        run: bash scripts/check-secrets.sh --all
      - if: steps.v.outputs.skip != 'true'
        run: node scripts/build-extension.mjs
      - if: steps.v.outputs.skip != 'true'
        run: npx --yes addons-linter dist/*-firefox.xpi

      - name: Sign for Firefox (unlisted, only if AMO keys are set)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        if: steps.v.outputs.skip != 'true' && env.AMO_JWT_ISSUER != ''
        run: |
          set -euo pipefail
          mkdir -p /tmp/ff dist/signed
          unzip -q dist/*-firefox.xpi -d /tmp/ff
          npx --yes web-ext sign --channel=unlisted --source-dir /tmp/ff \
            --artifacts-dir dist/signed --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          tag="${{ steps.v.outputs.tag }}"
          for f in dist/signed/*.xpi; do mv "$f" "dist/banterbox-${tag#v}-firefox-signed.xpi"; done

      - name: Create the release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          # Creates the tag on this commit if it doesn't exist yet.
          gh release create "$tag" dist/*.zip dist/*.xpi --target "$GITHUB_SHA" \
            --title "BanterBox $tag" --generate-notes
