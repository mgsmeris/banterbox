name: Build browser packages

# Every push to main builds the Chrome .zip and Firefox .xpi and puts them on the
# GitHub Release v<version_name or version> (from extension/manifest.json). Same
# version again just replaces the files; a new version makes a new release.
# Other branches and pull requests only build.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secrets:
    name: No settings, data or secrets in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-secrets.sh --all

  build:
    name: Build Chrome and Firefox add-ons
    needs: [secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-extension.mjs

      - name: Work out the version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Release tag uses version_name when set (e.g. 1.0.0-BETA), else version.
          name=$(node -p "const m=require('./extension/manifest.json'); m.version_name || m.version")
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          # Mozilla signs each version only once; reuse the signed file after that.
          if gh release view "v$name" --json assets -q '.assets[].name' 2>/dev/null | grep -qx banterbox-firefox-signed.xpi; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign for Firefox (unlisted, once per version, only if AMO keys are set)
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          env.AMO_JWT_ISSUER != '' && steps.v.outputs.signed != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          # Pasted secrets often carry a stray space or newline; AMO then rejects them.
          key=$(printf %s "$AMO_JWT_ISSUER" | tr -d '[:space:]')
          secret=$(printf %s "$AMO_JWT_SECRET" | tr -d '[:space:]')
          if ! [[ "$key" =~ ^user:[0-9]+:[0-9]+$ ]]; then
            echo "::error::AMO_JWT_ISSUER should look like user:12345678:123 (the 'JWT issuer' from addons.mozilla.org/developers/addon/api/key/). Check the secret, it may be swapped with AMO_JWT_SECRET."
            exit 1
          fi
          mkdir -p /tmp/ff /tmp/signed
          unzip -q dist/*-firefox.xpi -d /tmp/ff
          npx --yes web-ext sign --channel=unlisted --source-dir /tmp/ff             --artifacts-dir /tmp/signed --api-key "$key" --api-secret "$secret"
          mv /tmp/signed/*.xpi dist/banterbox-firefox-signed.xpi
          # Firefox reads this file from raw.githubusercontent.com (update_url in the manifest).
          cat > server/public/update.json <<JSON
          {
            "addons": {
              "banterbox@smeris.me": {
                "updates": [
                  {
                    "version": "${{ steps.v.outputs.version }}",
                    "update_link": "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/banterbox-firefox-signed.xpi"
                  }
                ]
              }
            }
          }
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: browser-packages
          path: dist/*.*
          retention-days: 30

      - name: Put the files on the GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.v.outputs.tag }}"
          files=(dist/*.zip dist/*.xpi)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA"               --title "BanterBox $tag" --generate-notes
          fi

      - name: Commit server/public/update.json (only after a new version was signed)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git diff --quiet -- server/public/update.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/public/update.json
          git commit -m "Firefox update.json for ${{ steps.v.outputs.tag }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

