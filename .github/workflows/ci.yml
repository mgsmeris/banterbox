name: Build and deploy

# Every push to main:
#   1. builds the Chrome .zip and Firefox .xpi and puts them on the GitHub Release
#      v<version> (version from extension/manifest.json). Same version again just
#      replaces the files; a new version makes a new release.
#   2. updates the "deploy" branch with the server code (server/ without tests),
#      which the web host pulls from.
# Other branches and pull requests only build.
on:
  push:
    branches-ignore: [deploy]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secrets:
    name: No settings, data or secrets in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-secrets.sh --all

  build:
    name: Build Chrome and Firefox add-ons
    needs: [secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-extension.mjs

      - name: Sign for Firefox (only if AMO keys are set)
        if: github.ref == 'refs/heads/main' && env.AMO_JWT_ISSUER != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          v=$(node -p "require('./extension/manifest.json').version")
          mkdir -p /tmp/ff dist/signed
          unzip -q dist/*-firefox.xpi -d /tmp/ff
          npx --yes web-ext sign --channel=unlisted --source-dir /tmp/ff \
            --artifacts-dir dist/signed --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          for f in dist/signed/*.xpi; do mv "$f" "dist/banterbox-$v-firefox-signed.xpi"; done

      - uses: actions/upload-artifact@v4
        with:
          name: browser-packages
          path: dist/*.*
          retention-days: 30

      - name: Put the files on the GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./extension/manifest.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip dist/*.xpi --clobber
          else
            gh release create "$tag" dist/*.zip dist/*.xpi --target "$GITHUB_SHA" \
              --title "BanterBox $tag" --generate-notes
          fi

  deploy:
    name: Update the deploy branch (server only)
    needs: [secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy server/ (without tests) onto the deploy branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin deploy >/dev/null; then
            git fetch origin deploy
            git worktree add -B deploy /tmp/deploy origin/deploy
          else
            git worktree add --orphan -b deploy /tmp/deploy
          fi

          rsync -a --delete --exclude '.git' --exclude 'tests/' server/ /tmp/deploy/

          cd /tmp/deploy
          git add -A
          # Same guard as everywhere else, on exactly what is about to be deployed.
          bash "$GITHUB_WORKSPACE/scripts/check-secrets.sh"
          if git diff --cached --quiet; then
            echo "Server code unchanged, nothing to deploy."
            exit 0
          fi
          git commit -m "Deploy ${GITHUB_SHA::7}: $(git -C "$GITHUB_WORKSPACE" log -1 --format=%s)"
          git push origin deploy
